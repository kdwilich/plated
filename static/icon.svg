<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!-- A 55 + 45 bar, per side. Two rules decide this drawing, and they have
	     been flipped against each other twice, so: the heaviest plate is RED
	     (55 lb, the IWF 25 kg red) and the next is BLUE (45 lb / 20 kg), and
	     plates load heaviest against the collar. Red is therefore the LARGER,
	     INNER plate. Correcting the sizes without moving the colours — or the
	     reverse — leaves the mark saying that a 45 outweighs a 55. -->
	<rect width="512" height="512" fill="#0b0c0e"/>
	<rect x="96" y="192" width="48" height="128" rx="16" fill="#0067a5"/>
	<rect x="144" y="160" width="64" height="192" rx="16" fill="#c8102e"/>
	<rect x="208" y="240" width="96" height="32" fill="#f2f4f7"/>
	<rect x="304" y="160" width="64" height="192" rx="16" fill="#c8102e"/>
	<rect x="368" y="192" width="48" height="128" rx="16" fill="#0067a5"/>
</svg>
