<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Zoom off: this is a one-handed logger, and a stray double-tap used to
		     leave the page magnified mid-set. iOS Safari overrides user-scalable
		     for accessibility, so `touch-action: manipulation` in reset.scss is
		     what actually closes the double-tap path there. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
		/>
		<meta name="theme-color" content="#0b0c0e" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- iOS ignores the manifest when you add to home screen: the icon, the
		     app label and the status bar all come from these instead. -->
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Plated" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
