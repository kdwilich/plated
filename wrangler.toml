name = "plated"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# `npm run dev` ignores database_id and uses a local sqlite copy keyed by the
# binding name; --remote commands and deploys use the real one.
[[d1_databases]]
binding = "DB"
# Still the old name, because this has to match what the database is actually
# called in Cloudflare — database_id is what binds, so a mismatch here just
# makes the config lie. Renaming it means renaming the D1 database first.
database_name = "plateload-db"
database_id = "dc08d426-db27-4e9d-b6af-b06ba7ee7843"
# schema.sql builds a database from nothing; migrations change one that already
# has data in it. wrangler looks in ./migrations unless told otherwise.
migrations_dir = "d1/migrations"
