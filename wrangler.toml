name = "plateload"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# `npm run dev:wrangler` ignores database_id and uses a local sqlite copy
# keyed by the binding name; --remote commands and deploys use the real id.
[[d1_databases]]
binding = "DB"
database_name = "plateload-db"
database_id = "dc08d426-db27-4e9d-b6af-b06ba7ee7843"
